[Upscaler]
; Backend: 0 = Native (Bypass), 1 = NVIDIA DLSS/DLAA, 2 = AMD FSR, 3 = TAA
Backend=2
; Mode: 1 = Native AA, 2 = Quality, 3 = Balanced, 4 = Performance, 5 = Ultra Performance
Mode=4
Sharpness=0.00
Preset=0
AutoSyncEliteConfig=1
PreserveNativeUi=1
HdrInput=0
; FSR 4 proof of concept: 1 = try the FSR 4 (D3D12 bridge) path first, 0 = FSR 3.1 D3D11 path only
Fsr4=1
; Profiling: 1 = write an FSR 4 per-stage timing summary to edpe.log every Fsr4ProfileInterval frames
Fsr4Profile=0
Fsr4ProfileInterval=300
; 1 = flush D3D11 after the bridge fence signal (EDPE default), 0 = do not
Fsr4Flush=1

[Jitter]
Enabled=1
InvertX=0
InvertY=0
SwapXY=0
Scale=1.00
PhaseCount=8
LogEnabled=0
LogInterval=10
LogFlushMs=1000
DebugView=0
DebugSensitivity=1.50
DebugThreshold=0.020
DebugMode=0

[Motion]
ZeroMotion=0
InvertX=0
InvertY=0
Scale=1.00

[Overlay]
ShowPerfOverlay=0
EnableProfiler=0
Corner=1
Scale=1.50
UiScale=1.00
DEV=1
